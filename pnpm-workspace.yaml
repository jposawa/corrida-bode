# O pnpm bloqueia scripts de postinstall por padrão (proteção contra pacote malicioso).
# Estes três precisam rodar o próprio script para funcionar — o esbuild, por exemplo, baixa
# o binário da plataforma nessa etapa, e sem ele o Vite não builda.
allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true

overrides:
  react-router@>=7.0.0 <7.12.0: '>=7.12.0'
  react-router@>=7.0.0 <=7.11.0: '>=7.12.0'
